name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-scan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [cart, catalogue, dispatch, payment, shipping, user, web]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # -------------------------
    # 🔍 Code Lint
    # -------------------------
    - name: Lint Code
      if: matrix.service != 'dispatch'
      run: |
        echo "Linting ${{ matrix.service }}"
        cd ${{ matrix.service }} || exit 0
        npm install || true
        npm run lint || true

    # -------------------------
    # 🔐 SCA Scan
    # -------------------------
    - name: SCA Scan (Trivy FS)
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './${{ matrix.service }}'
        format: 'table'
        exit-code: '0'

    # -------------------------
    # 🐳 Docker Login
    # -------------------------
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # -------------------------
    # 🏗️ Build Image
    # -------------------------
    - name: Build Docker Image
      continue-on-error: true
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest ./${{ matrix.service }}

    # -------------------------
    # 📤 Push Image
    # -------------------------
    - name: Push Docker Image
      continue-on-error: true
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

    # -------------------------
    # 🔍 Image Scan
    # -------------------------
    - name: Scan Docker Image (Trivy)
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest'
        format: 'table'
        exit-code: '0'
