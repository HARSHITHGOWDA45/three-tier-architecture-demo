name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  build-and-scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [cart, catalogue, dispatch, payment, shipping, user, web]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # -------------------------
    # 🔍 Code Lint (Basic Example)
    # -------------------------
    - name: Lint Code (Node Example)
      if: matrix.service != 'dispatch'   # skip if not needed
      run: |
        echo "Linting ${{ matrix.service }}"
        cd ${{ matrix.service }} || exit 0
        npm install || true
        npm run lint || true

    # -------------------------
    # 🔐 SCA (Dependency Scan using Trivy FS)
    # -------------------------
    - name: SCA Scan (Trivy FS)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './${{ matrix.service }}'
        format: 'table'
        exit-code: '0'

    # -------------------------
    # 🐳 Dockerfile Lint (Hadolint)
    # -------------------------
    - name: Hadolint Scan
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ matrix.service }}/Dockerfile

    # -------------------------
    # 🐳 Login to DockerHub
    # -------------------------
    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # -------------------------
    # 🏗️ Build Image
    # -------------------------
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest ./${{ matrix.service }}

    # -------------------------
    # 📤 Push Image
    # -------------------------
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

    # -------------------------
    # 🔍 Image Scan (Trivy Image)
    # -------------------------
    - name: Scan Docker Image (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest'
        format: 'table'
        exit-code: '0'
